<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数据浏览与审核 · ARX</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/browse.css"><script src="/browse.js" defer></script></head><body><div class="shell"><aside class="sidebar"><a class="brand" href="/">ARX<small>DATA COLLECTION</small></a><div class="side-label">工作空间</div><a class="nav-item" href="/">◫ 数采工作台</a><a class="nav-item active" href="/browse">▷ 数据浏览与审核</a><a class="nav-item" href="/guide" target="_blank">↗ 一页速查教程</a><div class="side-bottom"><div class="local-mark"><i></i> 本机工作空间</div><p>回放与审核<br>不发送设备动作</p></div></aside><main><header><div><div class="breadcrumb">工作空间 / 数据浏览</div><h2>看清每一条，再确认质量。</h2></div><button id="refresh" class="secondary">↻ 刷新列表</button></header><div id="message" role="status" aria-live="polite"></div><section class="browser-stats panel" id="stats">正在读取本地数据…</section><div class="browse-layout"><section class="panel catalogue"><div class="section-head"><h3>Episode 列表</h3><span id="count" class="tag"></span></div><label>搜索<input id="search" type="search" placeholder="任务或 Episode 编号"></label><div class="filter-grid"><label>任务<select id="task"><option value="">全部任务</option></select></label><label>人工审核<select id="review-filter"><option value="">全部状态</option><option value="pending">未审核</option><option value="approved">通过</option><option value="rejected">不通过</option><option value="needs_review">需复核</option></select></label><label>数据状态<select id="data-filter"><option value="active">有效记录</option><option value="all">含作废 / 删除</option><option value="warnings">有质检提醒</option></select></label></div><div id="episode-list" class="episode-list"></div></section><div id="detail" class="episode-detail"><section class="panel empty-detail">选择一条 Episode，查看三路视频与质检信息。</section></div></div><footer>ARX · 本地数据浏览 <span>空格 播放/暂停 · ← → 逐帧 · 所有审核显式保存</span></footer></main></div></body></html>
