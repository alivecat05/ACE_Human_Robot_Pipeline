[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piper-lerobot"
version = "0.1.0"
description = "Convert synchronized Piper recordings to local LeRobot datasets"
requires-python = ">=3.12"
dependencies = ["numpy", "opencv-python>=4.10,<5"]

[project.optional-dependencies]
export = ["lerobot==0.4.2"]

[tool.setuptools.packages.find]
include = ["piper_lerobot*"]
